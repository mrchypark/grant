services:
  trailbase:
    build:
      context: .
      dockerfile: Dockerfile.trailbase-auth-bridge
    container_name: grant-trailbase
    init: true
    environment:
      TRAILBASE_GRANT_INTERNAL_SECRET: ${TRAILBASE_GRANT_INTERNAL_SECRET}
      TRAILBASE_DATA_DIR: /data/trailbase
      TRAILBASE_ADDRESS: 0.0.0.0:4000
      TRAILBASE_DEV: ${TRAILBASE_DEV:-false}
      TRAILBASE_LOG_RESPONSES: ${TRAILBASE_LOG_RESPONSES:-false}
    volumes:
      - trailbase_data:/data/trailbase
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "4000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  grant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grant-app
    depends_on:
      trailbase:
        condition: service_healthy
    init: true
    environment:
      GRANT_BIND_ADDR: 0.0.0.0:8080
      GRANT_MASTER_KEY: ${GRANT_MASTER_KEY}
      GRANT_BOOTSTRAP_USER_ID: ${GRANT_BOOTSTRAP_USER_ID:-conalog-grant}
      GRANT_BOOTSTRAP_USER_NAME: ${GRANT_BOOTSTRAP_USER_NAME:-Conalog Grant}
      GRANT_TRAILBASE_BASE_URL: http://trailbase:4000
      GRANT_TRAILBASE_INTROSPECT_PATH: /api/grant/introspect
      GRANT_TRAILBASE_INTERNAL_SECRET: ${TRAILBASE_GRANT_INTERNAL_SECRET}
      GRANT_TRAILBASE_CACHE_TTL_SECONDS: ${GRANT_TRAILBASE_CACHE_TTL_SECONDS:-30}
      GRANT_RUNTIME_MODE: ${GRANT_RUNTIME_MODE:-embedded}
      GRANT_LOCAL_NODE_ROLE: ${GRANT_LOCAL_NODE_ROLE:-voter}
      GRANT_READ_CONSISTENCY: ${GRANT_READ_CONSISTENCY:-local}
      HQL_NODE_ID: ${HQL_NODE_ID:-1}
      HQL_NODES: ${HQL_NODES:-1 grant:8100 grant:8200}
      HQL_S3_URL: ${HQL_S3_URL:-}
      HQL_S3_BUCKET: ${HQL_S3_BUCKET:-}
      HQL_S3_REGION: ${HQL_S3_REGION:-}
      HQL_S3_PATH_STYLE: ${HQL_S3_PATH_STYLE:-false}
      HQL_S3_KEY: ${HQL_S3_KEY:-}
      HQL_S3_SECRET: ${HQL_S3_SECRET:-}
      HQL_LISTEN_ADDR_API: ${HQL_LISTEN_ADDR_API:-0.0.0.0}
      HQL_LISTEN_ADDR_RAFT: ${HQL_LISTEN_ADDR_RAFT:-0.0.0.0}
      HQL_DATA_DIR: /data/hiqlite
      HQL_SECRET_RAFT: ${HQL_SECRET_RAFT}
      HQL_SECRET_API: ${HQL_SECRET_API}
      HQL_ENC_KEYS_FROM: env
      ENC_KEYS: ${ENC_KEYS}
      ENC_KEY_ACTIVE: ${ENC_KEY_ACTIVE}
    volumes:
      - grant_data:/data/hiqlite
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  trailbase_data:
  grant_data:
