services:
  rauthy-init:
    image: busybox:1.36
    container_name: grant-rauthy-init
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /app/data
        chown -R 10001:10001 /app/data
        chmod -R 0770 /app/data
    volumes:
      - rauthy_data:/app/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.36.0
    container_name: grant-rauthy
    depends_on:
      rauthy-init:
        condition: service_completed_successfully
    init: true
    volumes:
      - rauthy_data:/app/data
      - ./deploy/rauthy/config.toml:/app/config.toml:ro
      - ./deploy/rauthy:/app/bootstrap:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "8080"
      - "8443"
      - "8100"
      - "8200"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped

  grant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grant-app
    depends_on:
      rauthy:
        condition: service_started
    init: true
    environment:
      GRANT_BIND_ADDR: 0.0.0.0:8080
      GRANT_MASTER_KEY: ${GRANT_MASTER_KEY}
      GRANT_BOOTSTRAP_USER_ID: ${GRANT_BOOTSTRAP_USER_ID:-conalog-grant}
      GRANT_BOOTSTRAP_USER_NAME: ${GRANT_BOOTSTRAP_USER_NAME:-Conalog Grant}
      GRANT_RAUTHY_BASE_URL: http://rauthy:8080
      GRANT_RAUTHY_INTROSPECT_PATH: /auth/v1/oidc/introspect
      GRANT_RAUTHY_USERINFO_PATH: /auth/v1/oidc/userinfo
      GRANT_RAUTHY_CLIENT_ID: ${GRANT_RAUTHY_CLIENT_ID:-grant}
      GRANT_RAUTHY_CLIENT_SECRET: ${GRANT_RAUTHY_CLIENT_SECRET}
      GRANT_RAUTHY_CACHE_TTL_SECONDS: ${GRANT_RAUTHY_CACHE_TTL_SECONDS:-30}
      GRANT_RUNTIME_MODE: ${GRANT_RUNTIME_MODE:-embedded}
      GRANT_LOCAL_NODE_ROLE: ${GRANT_LOCAL_NODE_ROLE:-voter}
      GRANT_READ_CONSISTENCY: ${GRANT_READ_CONSISTENCY:-local}
      HQL_NODE_ID: ${HQL_NODE_ID:-1}
      HQL_NODES: ${HQL_NODES:-1 grant:8100 grant:8200}
      HQL_S3_URL: ${HQL_S3_URL:-}
      HQL_S3_BUCKET: ${HQL_S3_BUCKET:-}
      HQL_S3_REGION: ${HQL_S3_REGION:-}
      HQL_S3_PATH_STYLE: ${HQL_S3_PATH_STYLE:-false}
      HQL_S3_KEY: ${HQL_S3_KEY:-}
      HQL_S3_SECRET: ${HQL_S3_SECRET:-}
      HQL_LISTEN_ADDR_API: ${HQL_LISTEN_ADDR_API:-0.0.0.0}
      HQL_LISTEN_ADDR_RAFT: ${HQL_LISTEN_ADDR_RAFT:-0.0.0.0}
      HQL_DATA_DIR: /data/hiqlite
      HQL_SECRET_RAFT: ${HQL_SECRET_RAFT}
      HQL_SECRET_API: ${HQL_SECRET_API}
      HQL_ENC_KEYS_FROM: env
      ENC_KEYS: ${ENC_KEYS}
      ENC_KEY_ACTIVE: ${ENC_KEY_ACTIVE}
    volumes:
      - grant_data:/data/hiqlite
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  rauthy_data:
  grant_data:
