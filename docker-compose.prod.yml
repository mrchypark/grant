services:
  minio:
    image: ${MINIO_IMAGE:?set pinned MINIO_IMAGE}
    container_name: certd-minio
    init: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address :9001
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:?set pinned MINIO_MC_IMAGE}
    container_name: certd-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        mc mb -p local/"$${ARTIFACTS_BUCKET}" || true
        mc mb -p local/"$${HQL_S3_BUCKET}" || true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ARTIFACTS_BUCKET: ${ARTIFACTS_BUCKET:-cert-artifacts}
      HQL_S3_BUCKET: ${HQL_S3_BUCKET:-cert-backups}
    restart: "no"

  trailbase:
    build:
      context: .
      dockerfile: Dockerfile.trailbase-auth-bridge
    container_name: certd-trailbase
    init: true
    environment:
      TRAILBASE_CERTD_INTERNAL_SECRET: ${TRAILBASE_CERTD_INTERNAL_SECRET}
      TRAILBASE_DATA_DIR: /data/trailbase
      TRAILBASE_ADDRESS: 0.0.0.0:4000
      TRAILBASE_DEV: ${TRAILBASE_DEV:-false}
      TRAILBASE_LOG_RESPONSES: ${TRAILBASE_LOG_RESPONSES:-false}
    volumes:
      - trailbase_data:/data/trailbase
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "4000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  certd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certd-app
    depends_on:
      trailbase:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    init: true
    environment:
      CERTD_BIND_ADDR: 0.0.0.0:8080
      CERTD_MASTER_KEY: ${CERTD_MASTER_KEY}
      CERTD_BOOTSTRAP_USER_ID: ${CERTD_BOOTSTRAP_USER_ID:-conalog-account}
      CERTD_BOOTSTRAP_USER_NAME: ${CERTD_BOOTSTRAP_USER_NAME:-Conalog Account}
      CERTD_TRAILBASE_BASE_URL: http://trailbase:4000
      CERTD_TRAILBASE_INTROSPECT_PATH: /api/certd/introspect
      CERTD_TRAILBASE_INTERNAL_SECRET: ${TRAILBASE_CERTD_INTERNAL_SECRET}
      CERTD_TRAILBASE_CACHE_TTL_SECONDS: ${CERTD_TRAILBASE_CACHE_TTL_SECONDS:-30}
      ARTIFACTS_BACKEND: s3
      ARTIFACTS_BUCKET: ${ARTIFACTS_BUCKET:-cert-artifacts}
      ARTIFACTS_REGION: ${ARTIFACTS_REGION:-us-east-1}
      ARTIFACTS_ENDPOINT: ${ARTIFACTS_ENDPOINT:-http://minio:9000}
      ARTIFACTS_PATH_STYLE: ${ARTIFACTS_PATH_STYLE:-true}
      ARTIFACTS_ACCESS_KEY: ${ARTIFACTS_ACCESS_KEY:-minioadmin}
      ARTIFACTS_SECRET_KEY: ${ARTIFACTS_SECRET_KEY:-minioadmin}
      CERTD_RUNTIME_MODE: ${CERTD_RUNTIME_MODE:-embedded}
      CERTD_LOCAL_NODE_ROLE: ${CERTD_LOCAL_NODE_ROLE:-voter}
      CERTD_READ_CONSISTENCY: ${CERTD_READ_CONSISTENCY:-local}
      HQL_NODE_ID: ${HQL_NODE_ID:-1}
      HQL_NODES: ${HQL_NODES:-1 certd:8200 certd:8100\n}
      HQL_S3_URL: ${HQL_S3_URL:-http://minio:9000}
      HQL_S3_BUCKET: ${HQL_S3_BUCKET:-cert-backups}
      HQL_S3_REGION: ${HQL_S3_REGION:-us-east-1}
      HQL_S3_PATH_STYLE: ${HQL_S3_PATH_STYLE:-true}
      HQL_S3_KEY: ${HQL_S3_KEY:-minioadmin}
      HQL_S3_SECRET: ${HQL_S3_SECRET:-minioadmin}
      HQL_LISTEN_ADDR_API: ${HQL_LISTEN_ADDR_API:-0.0.0.0}
      HQL_LISTEN_ADDR_RAFT: ${HQL_LISTEN_ADDR_RAFT:-0.0.0.0}
      HQL_DATA_DIR: /data/hiqlite
      HQL_SECRET_RAFT: ${HQL_SECRET_RAFT}
      HQL_SECRET_API: ${HQL_SECRET_API}
      HQL_ENC_KEYS_FROM: env
      ENC_KEYS: ${ENC_KEYS}
      ENC_KEY_ACTIVE: ${ENC_KEY_ACTIVE}
    volumes:
      - certd_data:/data/hiqlite
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  minio_data:
  trailbase_data:
  certd_data:
