services:
  minio:
    image: minio/minio:latest
    container_name: certd-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: certd-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          sleep 1
        done
        mc mb -p local/cert-artifacts || true
        mc mb -p local/cert-backups || true
    restart: "no"

  trailbase:
    build:
      context: .
      dockerfile: Dockerfile.trailbase-auth-bridge.dev
    container_name: certd-trailbase
    environment:
      TRAILBASE_CERTD_INTERNAL_SECRET: dev-trailbase-internal-secret
      TRAILBASE_DATA_DIR: /data/trailbase
      TRAILBASE_ADDRESS: 0.0.0.0:4000
      TRAILBASE_DEV: "true"
      TRAILBASE_LOG_RESPONSES: "true"
    volumes:
      - trailbase_data:/data/trailbase
    ports:
      - "4000:4000"
    restart: unless-stopped

  certd:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: certd-app
    depends_on:
      trailbase:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      CERTD_BIND_ADDR: 0.0.0.0:8080
      CERTD_MASTER_KEY: dev-only-master-key
      CERTD_BOOTSTRAP_USER_ID: conalog-account
      CERTD_BOOTSTRAP_USER_NAME: Conalog Account
      CERTD_TRAILBASE_BASE_URL: http://trailbase:4000
      CERTD_TRAILBASE_INTROSPECT_PATH: /api/certd/introspect
      CERTD_TRAILBASE_INTERNAL_SECRET: dev-trailbase-internal-secret
      CERTD_TRAILBASE_CACHE_TTL_SECONDS: "30"
      ARTIFACTS_BACKEND: s3
      ARTIFACTS_BUCKET: cert-artifacts
      ARTIFACTS_REGION: us-east-1
      ARTIFACTS_ENDPOINT: http://minio:9000
      ARTIFACTS_PATH_STYLE: "true"
      ARTIFACTS_ACCESS_KEY: minioadmin
      ARTIFACTS_SECRET_KEY: minioadmin
      CERTD_RUNTIME_MODE: embedded
      CERTD_LOCAL_NODE_ROLE: voter
      CERTD_READ_CONSISTENCY: local
      HQL_NODE_ID: "1"
      HQL_NODES: "1 certd:8200 certd:8100\n"
      HQL_S3_URL: http://minio:9000
      HQL_S3_BUCKET: cert-backups
      HQL_S3_REGION: us-east-1
      HQL_S3_PATH_STYLE: "true"
      HQL_S3_KEY: minioadmin
      HQL_S3_SECRET: minioadmin
      HQL_LISTEN_ADDR_API: 0.0.0.0
      HQL_LISTEN_ADDR_RAFT: 0.0.0.0
      HQL_DATA_DIR: /data/hiqlite
      HQL_SECRET_RAFT: SuperSecureSecret1337
      HQL_SECRET_API: AnotherSecureSecret42
      HQL_ENC_KEYS_FROM: env
      ENC_KEYS: "bVCyTsGaggVy5yqQ/UzluN29DZW41M3hTSkx6Y3NtZmRuQkR2TnJxUTYzcjQ=\n"
      ENC_KEY_ACTIVE: bVCyTsGaggVy5yqQ
    volumes:
      - certd_data:/data/hiqlite
    ports:
      - "18080:8080"
    restart: unless-stopped

volumes:
  minio_data:
  trailbase_data:
  certd_data:
