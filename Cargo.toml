[workspace]
members = [
    "crates/domain",
    "crates/infra",
    "crates/api",
    "crates/app",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
hiqlite = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[patch.crates-io]
hiqlite = { git = "https://github.com/mrchypark/hiqlite.git", rev = "3e2112cd140c24730a0d1493054ad007cdabc48e" }
