[workspace]
members = [
    "crates/domain",
    "crates/infra",
    "crates/api",
    "crates/app",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
curl = "0.4"
hex = "0.4"
hiqlite = "0.13"
openssl = "0.10"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
simple_asn1 = "0.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.16"

[patch.crates-io]
hiqlite = { git = "https://github.com/mrchypark/hiqlite.git", rev = "3e2112cd140c24730a0d1493054ad007cdabc48e" }
