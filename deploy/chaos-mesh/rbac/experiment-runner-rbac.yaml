apiVersion: v1
kind: ServiceAccount
metadata:
  name: certd-chaos-runner
  namespace: certd-chaos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: certd-chaos-runner
  namespace: certd-chaos
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["chaos-mesh.org"]
    resources:
      - podchaos
      - networkchaos
      - workflows
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: certd-chaos-runner
  namespace: certd-chaos
subjects:
  - kind: ServiceAccount
    name: certd-chaos-runner
    namespace: certd-chaos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: certd-chaos-runner
