apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: learner-1-to-voters-partition
  namespace: certd-chaos
spec:
  action: partition
  mode: all
  duration: 60s
  selector:
    namespaces:
      - certd-chaos
    labelSelectors:
      app: certd
      role: learner
      instance: learner-1
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - certd-chaos
      labelSelectors:
        app: certd
        role: voter
