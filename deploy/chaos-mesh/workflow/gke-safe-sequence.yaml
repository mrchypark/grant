apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: certd-gke-safe-sequence
  namespace: certd-chaos
spec:
  entry: safe-sequence
  templates:
    - name: safe-sequence
      templateType: Serial
      deadline: 8m
      children:
        - learner-restart
        - trailbase-down
        - learner-partition
    - name: learner-restart
      templateType: PodChaos
      deadline: 1m
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces:
            - certd-chaos
          labelSelectors:
            app: certd
            role: learner
            instance: learner-1
    - name: trailbase-down
      templateType: PodChaos
      deadline: 2m
      podChaos:
        action: pod-failure
        mode: all
        selector:
          namespaces:
            - certd-chaos
          labelSelectors:
            app: trailbase
    - name: learner-partition
      templateType: NetworkChaos
      deadline: 2m
      networkChaos:
        action: partition
        mode: all
        selector:
          namespaces:
            - certd-chaos
          labelSelectors:
            app: certd
            role: learner
            instance: learner-1
        direction: to
        target:
          mode: all
          selector:
            namespaces:
              - certd-chaos
            labelSelectors:
              app: certd
              role: voter
