apiVersion: v1
kind: Secret
metadata:
  name: rauthy-config
type: Opaque
stringData:
  config.toml: |
    [bootstrap]
    admin_email = "admin@localhost"
    bootstrap_dir = "/app/bootstrap"

    [cluster]
    node_id = 1
    nodes = ["1 localhost:8100 localhost:8200"]
    secret_raft = "dev-rauthy-raft-secret"
    secret_api = "dev-rauthy-api-secret"

    [email]
    rauthy_admin_email = "admin@localhost"
    smtp_from = "Rauthy <rauthy@localhost>"

    [encryption]
    keys = ["devkey01/MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="]
    key_active = "devkey01"

    [events]
    email = "admin@localhost"

    [server]
    scheme = "http"
    pub_url = "grant.local:80"
    proxy_mode = false

    [webauthn]
    rp_id = "grant.local"
    rp_origin = "http://grant.local:80"
  clients.json: |
    [
      {
        "id": "grant",
        "name": "Grant",
        "secret": {
          "Plain": "devRauthyClientSecret0000000000000000000000000000000000000000000"
        },
        "redirect_uris": [
          "http://grant.local:80/auth/callback"
        ],
        "post_logout_redirect_uris": [
          "http://grant.local:80/auth/v1"
        ],
        "allowed_origins": [
          "http://grant.local:80"
        ],
        "enabled": true,
        "flows_enabled": [
          "authorization_code",
          "client_credentials",
          "refresh_token"
        ],
        "access_token_alg": "EdDSA",
        "id_token_alg": "EdDSA",
        "auth_code_lifetime": 60,
        "access_token_lifetime": 3600,
        "scopes": [
          "openid",
          "profile",
          "email"
        ],
        "default_scopes": [
          "openid",
          "profile",
          "email"
        ],
        "force_mfa": false
      }
    ]
