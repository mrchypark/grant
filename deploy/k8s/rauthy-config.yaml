apiVersion: v1
kind: Secret
metadata:
  name: rauthy-config
type: Opaque
stringData:
  config.toml: |
    [bootstrap]
    admin_email = "admin@localhost"
    bootstrap_dir = "/app/bootstrap"

    [cluster]
    node_id = 1
    nodes = ["1 localhost:8100 localhost:8200"]
    secret_raft = "dev-rauthy-raft-secret"
    secret_api = "dev-rauthy-api-secret"

    [email]
    rauthy_admin_email = "admin@localhost"
    smtp_from = "Rauthy <rauthy@localhost>"

    [encryption]
    keys = ["devkey01/MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="]
    key_active = "devkey01"

    [events]
    email = "admin@localhost"

    [mfa]
    admin_force_mfa = false

    [server]
    scheme = "http"
    pub_url = "localhost:18080"
    proxy_mode = false

    [webauthn]
    rp_id = "localhost"
    rp_origin = "http://localhost:18080"
  clients.json: |
    [
      {
        "id": "grant",
        "name": "Grant",
        "secret": {
          "Plain": "__GRANT_RAUTHY_CLIENT_SECRET__"
        },
        "redirect_uris": [
          "http://localhost:18080/auth/callback"
        ],
        "post_logout_redirect_uris": [
          "http://localhost:18080/auth/v1"
        ],
        "allowed_origins": [
          "http://localhost:18080"
        ],
        "enabled": true,
        "flows_enabled": [
          "authorization_code",
          "client_credentials",
          "refresh_token"
        ],
        "access_token_alg": "EdDSA",
        "id_token_alg": "EdDSA",
        "auth_code_lifetime": 60,
        "access_token_lifetime": 3600,
        "scopes": [
          "openid",
          "profile",
          "email"
        ],
        "default_scopes": [
          "openid",
          "profile",
          "email"
        ],
        "force_mfa": false
      }
    ]
  api_keys.json: |
    [
      {
        "name": "__GRANT_RAUTHY_ADMIN_API_KEY_NAME__",
        "exp": 4070905200,
        "secret": {
          "Plain": "__GRANT_RAUTHY_ADMIN_API_KEY_SECRET__"
        },
        "access": [
          {
            "group": "Clients",
            "access_rights": [
              "read",
              "create",
              "update"
            ]
          },
          {
            "group": "Secrets",
            "access_rights": [
              "read",
              "update"
            ]
          }
        ]
      }
    ]
