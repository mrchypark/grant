apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rauthy
  labels:
    app: rauthy
spec:
  serviceName: rauthy-headless
  replicas: 1
  selector:
    matchLabels:
      app: rauthy
  template:
    metadata:
      labels:
        app: rauthy
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: rauthy
          image: ghcr.io/sebadob/rauthy:0.36.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: hiq-raft
              containerPort: 8100
            - name: hiq-api
              containerPort: 8200
          volumeMounts:
            - name: rauthy-data
              mountPath: /app/data
            - name: rauthy-config
              mountPath: /app/config.toml
              subPath: config.toml
              readOnly: true
            - name: rauthy-bootstrap
              mountPath: /app/bootstrap
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: hiq-api
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /auth/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 2
      volumes:
        - name: rauthy-config
          secret:
            secretName: rauthy-config
        - name: rauthy-bootstrap
          secret:
            secretName: rauthy-config
            items:
              - key: clients.json
                path: clients.json
        - name: rauthy-data
          emptyDir: {}
