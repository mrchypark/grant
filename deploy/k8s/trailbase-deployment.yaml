apiVersion: apps/v1
kind: Deployment
metadata:
  name: trailbase
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  selector:
    matchLabels:
      app: trailbase
  template:
    metadata:
      labels:
        app: trailbase
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: trailbase
          image: trailbase-auth-bridge:local
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          envFrom:
            - configMapRef:
                name: trailbase-config
            - secretRef:
                name: trailbase-backup-secret
          ports:
            - name: http
              containerPort: 4000
          volumeMounts:
            - name: traildepot
              mountPath: /app/traildepot
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
        - name: litestream
          image: litestream/litestream:0.3.14
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p "$(dirname "${LITESTREAM_DB_PATH}")"
              cat >/tmp/litestream.yml <<EOF
              dbs:
                - path: ${LITESTREAM_DB_PATH}
                  replicas:
                    - url: ${LITESTREAM_REPLICA_URL}
                      endpoint: ${LITESTREAM_ENDPOINT}
                      region: ${LITESTREAM_REGION}
                      access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
                      secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
              EOF
              while [ ! -f "${LITESTREAM_DB_PATH}" ]; do
                sleep 1
              done
              exec litestream replicate -config /tmp/litestream.yml
          envFrom:
            - configMapRef:
                name: trailbase-config
            - secretRef:
                name: trailbase-backup-secret
          volumeMounts:
            - name: traildepot
              mountPath: /app/traildepot
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              memory: 128Mi
              ephemeral-storage: 128Mi
      initContainers:
        - name: litestream-restore
          image: litestream/litestream:0.3.14
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p "${TRAILBASE_DATA_DIR}"
              mkdir -p "$(dirname "${LITESTREAM_DB_PATH}")"
              chmod -R 0770 "${TRAILBASE_DATA_DIR}"
              cat >/tmp/litestream.yml <<EOF
              dbs:
                - path: ${LITESTREAM_DB_PATH}
                  replicas:
                    - url: ${LITESTREAM_REPLICA_URL}
                      endpoint: ${LITESTREAM_ENDPOINT}
                      region: ${LITESTREAM_REGION}
                      access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
                      secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
              EOF
              litestream restore -config /tmp/litestream.yml -if-db-not-exists -if-replica-exists "${LITESTREAM_DB_PATH}"
          envFrom:
            - configMapRef:
                name: trailbase-config
            - secretRef:
                name: trailbase-backup-secret
          volumeMounts:
            - name: traildepot
              mountPath: /app/traildepot
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              memory: 128Mi
              ephemeral-storage: 128Mi
      volumes:
        - name: traildepot
          emptyDir: {}
