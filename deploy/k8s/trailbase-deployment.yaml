apiVersion: apps/v1
kind: Deployment
metadata:
  name: trailbase
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  selector:
    matchLabels:
      app: trailbase
  template:
    metadata:
      labels:
        app: trailbase
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: trailbase
          image: trailbase-auth-bridge:local
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          envFrom:
            - configMapRef:
                name: trailbase-config
          env:
            - name: TRAILBASE_GRANT_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: grant-secrets
                  key: TRAILBASE_GRANT_INTERNAL_SECRET
          ports:
            - name: http
              containerPort: 4000
          volumeMounts:
            - name: traildepot
              mountPath: /app/traildepot
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      initContainers:
        - name: init-trailbase-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p "${TRAILBASE_DATA_DIR}"
              chown -R 65532:65532 "${TRAILBASE_DATA_DIR}"
              chmod -R 0770 "${TRAILBASE_DATA_DIR}"
          envFrom:
            - configMapRef:
                name: trailbase-config
          volumeMounts:
            - name: traildepot
              mountPath: /app/traildepot
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              memory: 128Mi
              ephemeral-storage: 128Mi
      volumes:
        - name: traildepot
          emptyDir: {}
