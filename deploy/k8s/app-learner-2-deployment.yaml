apiVersion: apps/v1
kind: Deployment
metadata:
  name: certd-learner-2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: certd
      role: learner
      instance: learner-2
  template:
    metadata:
      labels:
        app: certd
        role: learner
        instance: learner-2
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      containers:
        - name: certd
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          image: certd:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: certd-config
            - secretRef:
                name: certd-secrets
          env:
            - name: CERTD_RUNTIME_MODE
              value: split
            - name: CERTD_LOCAL_NODE_ROLE
              value: learner
            - name: CERTD_READ_CONSISTENCY
              value: local
            - name: CERTD_TRAILBASE_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: certd-secrets
                  key: TRAILBASE_CERTD_INTERNAL_SECRET
            - name: CERTD_REMOTE_NODES
              value: certd-voter-0.certd-headless.certd.svc.cluster.local:8200,certd-voter-1.certd-headless.certd.svc.cluster.local:8200,certd-voter-2.certd-headless.certd.svc.cluster.local:8200
            - name: CERTD_REMOTE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: certd-secrets
                  key: HQL_SECRET_API
            - name: HQL_NODE_ID
              value: "5"
          ports:
            - name: http
              containerPort: 8080
            - name: raft
              containerPort: 8100
            - name: hiq-api
              containerPort: 8200
          volumeMounts:
            - name: data
              mountPath: /var/lib/certd
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir: {}
