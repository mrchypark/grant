apiVersion: v1
kind: Secret
metadata:
  name: certd-secrets
type: Opaque
stringData:
  CERTD_MASTER_KEY: "replace-with-master-key"
  HQL_SECRET_RAFT: "replace-with-raft-secret"
  HQL_SECRET_API: "replace-with-api-secret"
  ENC_KEYS: "replace-with-hiqlite-enc-keys"
  ENC_KEY_ACTIVE: "replace-with-active-enc-key-id"
  HQL_S3_KEY: "replace-with-minio-access-key"
  HQL_S3_SECRET: "replace-with-minio-secret-key"
