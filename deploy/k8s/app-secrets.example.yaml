apiVersion: v1
kind: Secret
metadata:
  name: grant-secrets
type: Opaque
stringData:
  GRANT_MASTER_KEY: "replace-with-master-key"
  GRANT_APP_AUTH_KEY: "replace-with-distinct-application-auth-key"
  GRANT_RAUTHY_CLIENT_ID: "grant"
  GRANT_RAUTHY_CLIENT_SECRET: "replace-with-alphanumeric-rauthy-client-secret-at-least-64-characters-long"
  GRANT_RAUTHY_CLIENT_READ_API_KEY: "replace-with-read-only-rauthy-api-key-name-dollar-secret"
  HQL_SECRET_RAFT: "replace-with-raft-secret"
  HQL_SECRET_API: "replace-with-api-secret"
  ENC_KEYS: "replace-with-hiqlite-enc-keys"
  ENC_KEY_ACTIVE: "replace-with-active-enc-key-id"
  HQL_S3_KEY: "replace-with-s3-access-key"
  HQL_S3_SECRET: "replace-with-s3-secret-key"
