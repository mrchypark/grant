apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: certd-voter
spec:
  serviceName: certd-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: certd
      role: voter
  template:
    metadata:
      labels:
        app: certd
        role: voter
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              mkdir -p /var/lib/certd
              chown -R 10001:10001 /var/lib/certd || true
              chmod -R ug+rwX /var/lib/certd || true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/certd
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: certd
              role: voter
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: certd
                    role: voter
      containers:
        - name: certd
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          image: certd:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: certd-config
            - secretRef:
                name: certd-secrets
          env:
            - name: CERTD_RUNTIME_MODE
              value: embedded
            - name: CERTD_LOCAL_NODE_ROLE
              value: voter
            - name: CERTD_READ_CONSISTENCY
              value: strong
            - name: CERTD_TRAILBASE_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: certd-secrets
                  key: TRAILBASE_CERTD_INTERNAL_SECRET
            - name: HQL_NODE_ID_FROM
              value: k8s
          ports:
            - name: http
              containerPort: 8080
            - name: raft
              containerPort: 8100
            - name: hiq-api
              containerPort: 8200
          volumeMounts:
            - name: data
              mountPath: /var/lib/certd
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: local-path
