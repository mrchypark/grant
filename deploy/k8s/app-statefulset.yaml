apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grant-voter
spec:
  serviceName: grant-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels: {app: grant, role: voter}
  template:
    metadata:
      labels: {app: grant, role: voter}
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: grant, role: voter}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: grant, role: voter}
      containers:
        - name: grant
          image: grant:local
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef: {name: grant-config}
            - secretRef: {name: grant-secrets}
            - secretRef: {name: grant-rhiza-storage}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: GRANT_RUNTIME_MODE
              value: embedded
            - name: GRANT_LOCAL_NODE_ROLE
              value: voter
            - name: GRANT_READ_CONSISTENCY
              value: strong
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
            - {name: peer, containerPort: 8100, protocol: UDP}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grant}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 128Mi}
            limits: {memory: 512Mi, ephemeral-storage: 512Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          # Native Rhiza quorum durability is in the shared object store.
          emptyDir: {}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
