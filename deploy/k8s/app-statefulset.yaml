apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grant-voter
spec:
  serviceName: grant-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: grant
      role: voter
  template:
    metadata:
      labels:
        app: grant
        role: voter
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -lc
            - |
              mkdir -p /var/lib/grant
              chown -R 10001:10001 /var/lib/grant || true
              chmod -R ug+rwX /var/lib/grant || true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grant
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: grant
              role: voter
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: grant
                    role: voter
      containers:
        - name: grant
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          image: grant:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: grant-config
            - secretRef:
                name: grant-secrets
          env:
            - name: GRANT_RUNTIME_MODE
              value: embedded
            - name: GRANT_LOCAL_NODE_ROLE
              value: voter
            - name: GRANT_READ_CONSISTENCY
              value: strong
            - name: GRANT_TRAILBASE_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: grant-secrets
                  key: TRAILBASE_GRANT_INTERNAL_SECRET
            - name: HQL_NODE_ID_FROM
              value: k8s
          ports:
            - name: http
              containerPort: 8080
            - name: raft
              containerPort: 8100
            - name: hiq-api
              containerPort: 8200
          volumeMounts:
            - name: data
              mountPath: /var/lib/grant
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          # Intentionally ephemeral: voter recovery is validated through remote backup/restore,
          # not local PVC reattachment.
          emptyDir: {}
