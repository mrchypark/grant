apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grant-voter
spec:
  serviceName: grant-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: grant
      role: voter
  template:
    metadata:
      labels:
        app: grant
        role: voter
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: lifecycle-gate
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["/bin/sh", "/gate/lifecycle-gate.sh"]
          env:
            - name: LIFECYCLE_HEADLESS_SERVICE
              value: grant-headless
            - name: LIFECYCLE_REPLICAS
              value: "3"
            - name: LIFECYCLE_PEER_PORT
              value: "8080"
            - name: LIFECYCLE_PEER_PATH
              value: /readyz
            - name: LIFECYCLE_ALLOW_LOCAL_FRESH
              value: "true"
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: lifecycle-state
              mountPath: /lifecycle
              readOnly: true
            - name: lifecycle-gate
              mountPath: /gate
              readOnly: true
            - name: restore-authorization
              mountPath: /restore
              readOnly: true
        - name: init-data-permissions
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -lc
            - |
              mkdir -p /var/lib/grant
              chown -R 10001:10001 /var/lib/grant || true
              chmod -R ug+rwX /var/lib/grant || true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grant
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: grant
              role: voter
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: grant
                    role: voter
      containers:
        - name: grant
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          image: grant:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/gate/restore-once.sh"]
          envFrom:
            - configMapRef:
                name: grant-config
            - secretRef:
                name: grant-secrets
          env:
            - name: GRANT_RUNTIME_MODE
              value: embedded
            - name: GRANT_LOCAL_NODE_ROLE
              value: voter
            - name: GRANT_READ_CONSISTENCY
              value: strong
            - name: GRANT_RAUTHY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grant-secrets
                  key: GRANT_RAUTHY_CLIENT_ID
            - name: GRANT_RAUTHY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grant-secrets
                  key: GRANT_RAUTHY_CLIENT_SECRET
            - name: HQL_NODE_ID_FROM
              value: k8s
            - name: RESTORE_ONCE_EXEC
              value: /usr/local/bin/grant
            - name: RESTORE_ONCE_MARKER
              value: /var/lib/grant/hiqlite/.restore-consumed
            - name: RESTORE_ONCE_HEALTH_URL
              value: http://127.0.0.1:8080/healthz
            - name: RESTORE_ONCE_READY_URL
              value: http://127.0.0.1:8080/readyz
            - name: RESTORE_ONCE_READY_TIMEOUT_SECONDS
              value: "300"
            - name: RESTORE_ONCE_READY_INTERVAL_SECONDS
              value: "2"
            - name: RESTORE_ONCE_READY_SUCCESSES
              value: "3"
            - name: RESTORE_ONCE_PROBE_TIMEOUT_SECONDS
              value: "2"
            - name: RESTORE_ONCE_SIGNAL_GRACE_SECONDS
              value: "10"
          ports:
            - name: http
              containerPort: 8080
            - name: raft
              containerPort: 8100
            - name: hiq-api
              containerPort: 8200
          volumeMounts:
            - name: data
              mountPath: /var/lib/grant
            - name: lifecycle-state
              mountPath: /lifecycle
              readOnly: true
            - name: lifecycle-gate
              mountPath: /gate
              readOnly: true
            - name: restore-authorization
              mountPath: /restore
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: lifecycle-state
          configMap:
            name: grant-lifecycle-state
            items:
              - key: grant-mode
                path: mode
              - key: recovery-id
                path: recovery-id
        - name: lifecycle-gate
          configMap:
            name: lifecycle-gate
            defaultMode: 0555
        - name: data
          # Intentionally ephemeral: voter recovery is validated through remote backup/restore,
          # not local PVC reattachment.
          emptyDir: {}
        - name: restore-authorization
          secret:
            secretName: grant-restore-once
            optional: true
