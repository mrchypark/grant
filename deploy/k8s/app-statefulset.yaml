apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: certd
spec:
  serviceName: certd-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: certd
  template:
    metadata:
      labels:
        app: certd
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: certd
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: certd
      containers:
        - name: certd
          image: certd:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: certd-config
            - secretRef:
                name: certd-secrets
          ports:
            - name: http
              containerPort: 8080
            - name: raft
              containerPort: 8100
            - name: hiq-api
              containerPort: 8200
          volumeMounts:
            - name: data
              mountPath: /var/lib/certd
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
