apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: certd-voter
spec:
  serviceName: certd-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: certd
      role: voter
  template:
    metadata:
      labels:
        app: certd
        role: voter
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: certd
              role: voter
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: certd
                    role: voter
      containers:
        - name: certd
          image: certd:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: certd-config
            - secretRef:
                name: certd-secrets
          env:
            - name: CERTD_RUNTIME_MODE
              value: embedded
            - name: CERTD_LOCAL_NODE_ROLE
              value: voter
            - name: CERTD_READ_CONSISTENCY
              value: strong
            - name: HQL_NODE_ID_FROM
              value: k8s
          ports:
            - name: http
              containerPort: 8080
            - name: raft
              containerPort: 8100
            - name: hiq-api
              containerPort: 8200
          volumeMounts:
            - name: data
              mountPath: /var/lib/certd
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir: {}
