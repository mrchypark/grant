apiVersion: v1
kind: Service
metadata:
  name: rauthy
spec:
  type: ClusterIP
  selector:
    app: rauthy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: rauthy-headless
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: rauthy
  ports:
    - name: hiq-raft
      port: 8100
      targetPort: 8100
    - name: hiq-api
      port: 8200
      targetPort: 8200
