apiVersion: v1
kind: Service
metadata:
  name: grant
spec:
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: grant
    role: voter
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: raft
      port: 8100
      targetPort: 8100
    - name: hiq-api
      port: 8200
      targetPort: 8200
