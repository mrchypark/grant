apiVersion: v1
kind: Service
metadata:
  name: certd-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: certd
    role: voter
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: raft
      port: 8100
      targetPort: 8100
    - name: hiq-api
      port: 8200
      targetPort: 8200
