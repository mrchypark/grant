apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# IED-style Grant-only deployment. Patch Data is an internal dependency and
# Rauthy resources and credentials are deliberately absent from this overlay.
resources:
  - ../../k8s

patches:
  - target:
      kind: ConfigMap
      name: grant-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grant-config
      data:
        GRANT_AUTH_PROVIDER: patch-data
        GRANT_PATCH_DATA_BASE_URL: http://patch-data.patch.svc.cluster.local:8090
        GRANT_PATCH_DATA_EXPOSURE_APPLICATION_ID: patch-data-exposure
  - target:
      kind: StatefulSet
      name: grant-voter
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: grant-voter
      spec:
        template:
          spec:
            containers:
              - name: grant
                env:
                  - name: GRANT_RAUTHY_CLIENT_ID
                    $patch: delete
                  - name: GRANT_RAUTHY_CLIENT_SECRET
                    $patch: delete
  - target:
      kind: StatefulSet
      name: rauthy
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: rauthy
  - target:
      kind: Service
      name: rauthy
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: rauthy
  - target:
      kind: Service
      name: rauthy-headless
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: rauthy-headless
  - target:
      kind: PodDisruptionBudget
      name: rauthy
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: rauthy
  - target:
      kind: Secret
      name: rauthy-config
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: rauthy-config
