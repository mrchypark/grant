apiVersion: v1
kind: Service
metadata:
  name: grant-standalone
spec:
  selector: {app: grant, role: standalone}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: grant-standalone-headless
spec:
  clusterIP: None
  selector: {app: grant, role: standalone}
  ports:
    - {name: http, port: 8080, targetPort: http}
