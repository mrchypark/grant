apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grant-private-runtime
spec:
  podSelector:
    matchLabels: {app: grant, role: voter}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 8080, protocol: TCP}
    - from:
        - podSelector:
            matchLabels: {app: grant, role: voter}
      ports:
        - {port: 8100, protocol: UDP}
    - from:
        - podSelector:
            matchLabels: {grant-runtime-client: "true"}
      ports:
        - {port: 8200, protocol: TCP}
