apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: rauthy
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: rauthy-data
          emptyDir: {}
      - op: remove
        path: /spec/volumeClaimTemplates
