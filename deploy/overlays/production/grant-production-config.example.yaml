apiVersion: v1
kind: ConfigMap
metadata:
  name: grant-production-config
data:
  GRANT_BIND_ADDR: "0.0.0.0:8080"
  GRANT_RAUTHY_BASE_URL: "http://rauthy:8080"
  GRANT_RAUTHY_INTROSPECT_PATH: "/auth/v1/oidc/introspect"
  GRANT_RAUTHY_USERINFO_PATH: "/auth/v1/oidc/userinfo"
  GRANT_RAUTHY_CACHE_TTL_SECONDS: "45"
  HQL_NODES: |
    1 grant-voter-0.grant-headless:8100 grant-voter-0.grant-headless:8200
    2 grant-voter-1.grant-headless:8100 grant-voter-1.grant-headless:8200
    3 grant-voter-2.grant-headless:8100 grant-voter-2.grant-headless:8200
  HQL_LISTEN_ADDR_API: "0.0.0.0"
  HQL_LISTEN_ADDR_RAFT: "0.0.0.0"
  HQL_DATA_DIR: "/var/lib/grant/hiqlite"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grant-production-backup
data:
  BACKUP_GENERATION: "grant-prod-g42"
  KEYRING_GENERATION: "grant-keyring-g42"
  RECOVERY_SCHEMA_ID: "grant-schema-v1"
  HQL_BACKUP_CRON: "0 0 * * * * *"
  HQL_BACKUP_KEEP_DAYS: "30"
  HQL_BACKUP_KEEP_DAYS_LOCAL: "1"
  HQL_S3_URL: "https://s3.example.com"
  HQL_S3_BUCKET: "grant-production-g42-backups"
  HQL_S3_REGION: "example-region-1"
  HQL_S3_PATH_STYLE: "false"
