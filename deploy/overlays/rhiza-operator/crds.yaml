                    operationID: {type: string, minLength: 1}
                    remove: {type: string, minLength: 1}
                    voterPods:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [nodeID, pod]
                        properties:
                          nodeID: {type: string, minLength: 1}
