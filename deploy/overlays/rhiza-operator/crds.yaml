              type: object
              required: [statefulSet, sourceClusterID, durability]
              properties:
                statefulSet: {type: string, minLength: 1}
                container: {type: string}
                sourceClusterID: {type: string, minLength: 1}
                durability: {type: string, enum: [async, before-ack]}
                recoveryID: {type: string}
                allowDataLoss: {type: boolean}
                maxArchiveAgeSeconds: {type: integer, format: int64, minimum: 0}
                anchorID: {type: string}
                fence:
                  type: object
                  properties:
                    recoveryID: {type: string}
                    clusterID: {type: string}
                    statefulSetUID: {type: string}
