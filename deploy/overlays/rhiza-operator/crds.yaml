                    fence:
                      type: object
                      required: [nodeID, walIdentity, workloadUID, confirmed, evidence]
                      properties:
                        nodeID: {type: string, minLength: 1}
                        walIdentity: {type: string, minLength: 1}
                        workloadUID: {type: string, minLength: 1}
                        confirmed: {type: boolean}
                        evidence: {type: string, minLength: 1}
