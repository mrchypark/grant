apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhiza-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhiza-operator
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, update]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizarecoveries]
    verbs: [get, list, create, update]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizarecoveries/status]
    verbs: [get, update]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizaclusters]
    verbs: [get, list]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizaclusters/status]
    verbs: [get, update]
  - apiGroups: [rhiza.mrchypark.dev]
    resources: [rhizafences]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhiza-operator
subjects:
  - kind: ServiceAccount
    name: rhiza-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhiza-operator
