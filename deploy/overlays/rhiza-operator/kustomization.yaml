apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Opt-in embedded Rhiza recovery controller for the existing grant namespace.
namespace: grant
resources:
  - ../../k8s
  - crds.yaml
  - rbac.yaml
  - deployment.yaml
  - native-config.yaml
  - observe.yaml
  - cluster-observe.yaml
  - network-policy.yaml
patches:
  - path: grant-config.yaml
  - path: grant-voter.yaml
