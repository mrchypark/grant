apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhiza-operator
  labels: {app.kubernetes.io/name: rhiza-operator}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rhiza-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rhiza-operator}
    spec:
      serviceAccountName: rhiza-operator
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: ghcr.io/mrchypark/rhiza-operator:v0.19.0@sha256:00b5e7a4c33c84ddbc2b7272b7d06bd3dd8315e31acb29507ad627d522a19d67
          imagePullPolicy: IfNotPresent
          args: [--namespace=$(POD_NAMESPACE)]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          envFrom:
            - configMapRef: {name: grant-rhiza-config}
            - secretRef: {name: grant-rhiza-operator-object-store}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: tmp
          emptyDir: {}
