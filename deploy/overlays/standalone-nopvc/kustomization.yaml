apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../standalone
configMapGenerator:
  - name: grant-standalone-config
    behavior: merge
    literals:
      - RHIZA_OBJSTORE_PROVIDER=s3
      - RHIZA_OBJSTORE_DIR=
      - RHIZA_OBJSTORE_INSECURE=false
      - RHIZA_OBJSTORE_DURABILITY=before-ack
patches:
  - target:
      kind: StatefulSet
      name: grant-standalone
    patch: |-
      - op: remove
        path: /spec/volumeClaimTemplates
      - op: remove
        path: /spec/persistentVolumeClaimRetentionPolicy
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: data
          emptyDir:
            sizeLimit: 10Gi
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
