name: Temporary GHCR cleanup verification

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify deleted version and preserved v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          TARGET_ID: "1433030810"
          TARGET_DIGEST: sha256:a5609e81d811caf0dc32cd8e3b073eebad59b200f786bab92c9770165660db09
          TARGET_SHA_TAG: sha-3a377023c4e8a714902d12fb6a0cf4511602f110
          PROTECTED_DIGEST: sha256:05b6131205e6b3601310fdc00705cab13830766031d8ebd7dfdaa5d9109e4ff9
        run: |
          set -eu
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          endpoint="users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions"
          set +e
          gh api --include "$endpoint/$TARGET_ID" > deleted-version-response.txt 2>&1
          get_status=$?
          set -e
          test "$get_status" -ne 0
          grep -Eq '^HTTP/[0-9.]+ 404 ' deleted-version-response.txt

          gh api --paginate "$endpoint?per_page=100" | jq -s '[.[][] | {id, digest: .name, tags: .metadata.container.tags}]' > after.json
          jq -e --argjson id "$TARGET_ID" --arg digest "$TARGET_DIGEST" --arg sha "$TARGET_SHA_TAG" --arg protected "$PROTECTED_DIGEST" '
            all(.[]; (.id != $id) and (.digest != $digest) and ((.tags | index("latest")) == null) and ((.tags | index($sha)) == null)) and
            ([.[] | select(.digest == $protected and (.tags | index("v0.1.0") != null))] | length) == 1
          ' after.json >/dev/null

          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          published_digest="$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}:v0.1.0" --format '{{.Manifest.Digest}}')"
          test "$published_digest" = "$PROTECTED_DIGEST"
          jq -n --arg repository "$GITHUB_REPOSITORY" --argjson id "$TARGET_ID" --arg digest "$TARGET_DIGEST" --arg sha "$TARGET_SHA_TAG" --arg protected "$PROTECTED_DIGEST" '{repository: $repository, deleted_version_id: $id, deleted_digest: $digest, removed_tags: ["latest", $sha], preserved_v0_1_0_digest: $protected, result: "verified"}' > verification-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ghcr-cleanup-verification
          path: |
            deleted-version-response.txt
            after.json
            verification-result.json
          if-no-files-found: ignore
          retention-days: 7
