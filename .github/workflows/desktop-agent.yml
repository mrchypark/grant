name: desktop-agent

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop-agent/**"
      - ".github/workflows/desktop-agent.yml"
  push:
    branches: [main]
    paths:
      - "desktop-agent/**"
      - ".github/workflows/desktop-agent.yml"

concurrency:
  group: desktop-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-agent
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop-agent/go.mod
          cache-dependency-path: desktop-agent/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # 네이티브 OS 바이너리만 빌드. darwin cgo(Cocoa) / windows PE 헤더 플래그 때문에
      # 크로스 빌드는 다루지 않고 각 러너가 자신의 타겟만 책임진다.
      - name: make build
        if: runner.os != 'Windows'
        run: make build

      - name: go build (Windows)
        if: runner.os == 'Windows'
        run: |
          set -e
          mkdir -p dist
          GOHOSTOS="$(go env GOHOSTOS)"
          GOHOSTARCH="$(go env GOHOSTARCH)"
          GARBLE_VERSION="v0.16.0"
          GARBLE_BIN_DIR="$PWD/.bin/${GOHOSTOS}-${GOHOSTARCH}/${GARBLE_VERSION}"
          GARBLE_BIN="$GARBLE_BIN_DIR/garble.exe"
          mkdir -p "$GARBLE_BIN_DIR"
          GOTOOLCHAIN=auto GOOS= GOARCH= GOBIN="$GARBLE_BIN_DIR" go install mvdan.cc/garble@${GARBLE_VERSION}
          GOTOOLCHAIN=auto GOOS="$(go env GOOS)" GOARCH="$(go env GOARCH)" "$GARBLE_BIN" -literals build -ldflags "-H=windowsgui" -o dist/ ./cmd/desktop-agent
