name: e2e-local

on:
  workflow_dispatch:
    inputs:
      publish_rauthy_launcher_gar:
        description: Publish the feature Rauthy launcher image to GAR
        required: false
        default: false
        type: boolean
      launcher_source_sha:
        description: Exact 40-character feature-branch launcher commit to publish
        required: false
        default: ''
        type: string
      launcher_confirmation:
        description: Type publish-grant-rauthy-launcher-gar
        required: false
        default: ''
        type: string
      exposure_artifact_asset_id:
        description: Optional Grant release asset ID for Exposure interop
        required: false
        default: ''
        type: string
      exposure_artifact_sha256:
        description: SHA-256 of the Exposure ZIP asset
        required: false
        default: ''
        type: string
      exposure_binary_sha256:
        description: SHA-256 of the exposure executable in the ZIP
        required: false
        default: ''
        type: string
      exposure_source_sha:
        description: Exact Exposure supplier source commit for evidence
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - ".github/workflows/e2e-local.yml"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "cmd/**"
      - "Dockerfile"
      - "README.md"
      - "deploy/**"
      - "docs/**"
      - "scripts/**"

concurrency:
  group: >-
    ${{ inputs.publish_rauthy_launcher_gar &&
      format('rauthy-launcher-gar-{0}', github.ref) ||
      format('e2e-local-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !inputs.publish_rauthy_launcher_gar }}

jobs:
  exposure-artifact:
    if: ${{ inputs.exposure_artifact_asset_id != '' && !inputs.publish_rauthy_launcher_gar }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate Exposure supplier inputs
        id: supplier
        shell: bash
        env:
          EXPOSURE_ASSET_ID: ${{ inputs.exposure_artifact_asset_id }}
          EXPOSURE_ARTIFACT_SHA256: ${{ inputs.exposure_artifact_sha256 }}
          EXPOSURE_BINARY_SHA256: ${{ inputs.exposure_binary_sha256 }}
          EXPOSURE_SOURCE_SHA: ${{ inputs.exposure_source_sha }}
        run: |
          set -euo pipefail
          exposure_dir="$(mktemp -d "$RUNNER_TEMP/grant-exposure-download.XXXXXX")"
          echo "directory=$exposure_dir" >> "$GITHUB_OUTPUT"
          mkdir "$exposure_dir/evidence"
          case "$EXPOSURE_ASSET_ID" in
            ''|*[!0-9]*) echo 'Invalid Exposure asset ID' >&2; exit 1 ;;
          esac
          test "${#EXPOSURE_ARTIFACT_SHA256}" -eq 64
          test "${#EXPOSURE_BINARY_SHA256}" -eq 64
          test "${#EXPOSURE_SOURCE_SHA}" -eq 40
          case "$EXPOSURE_ARTIFACT_SHA256$EXPOSURE_BINARY_SHA256$EXPOSURE_SOURCE_SHA" in
            *[!0-9a-f]*) echo 'Invalid Exposure hash or source SHA' >&2; exit 1 ;;
          esac
          printf 'asset_id=%s\nartifact_sha256=%s\nbinary_sha256=%s\nsource_sha=%s\n' \
            "$EXPOSURE_ASSET_ID" "$EXPOSURE_ARTIFACT_SHA256" \
            "$EXPOSURE_BINARY_SHA256" "$EXPOSURE_SOURCE_SHA" \
            > "$exposure_dir/evidence/supplier.txt"

      - name: Download and verify Grant draft release ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPOSURE_ASSET_ID: ${{ inputs.exposure_artifact_asset_id }}
          EXPOSURE_ARTIFACT_SHA256: ${{ inputs.exposure_artifact_sha256 }}
          EXPOSURE_DIRECTORY: ${{ steps.supplier.outputs.directory }}
        run: |
          set -euo pipefail
          gh api "repos/mrchypark/grant/releases/assets/$EXPOSURE_ASSET_ID" \
            --method GET -H 'Accept: application/octet-stream' \
            > "$EXPOSURE_DIRECTORY/exposure.zip" 2> "$EXPOSURE_DIRECTORY/evidence/download.log"
          printf '%s  %s\n' "$EXPOSURE_ARTIFACT_SHA256" "$EXPOSURE_DIRECTORY/exposure.zip" \
            | sha256sum --check | tee "$EXPOSURE_DIRECTORY/evidence/archive-check.log"

      - name: Hand off verified Exposure ZIP and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exposure-verified-supplier
          path: |
            ${{ steps.supplier.outputs.directory }}/exposure.zip
            ${{ steps.supplier.outputs.directory }}/evidence/supplier.txt
          if-no-files-found: error

      - name: Preserve Exposure download evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exposure-artifact-download-evidence
          path: ${{ runner.temp }}/grant-exposure-download.*/evidence/
          if-no-files-found: ignore

      - name: Remove owned Exposure download ZIP
        if: ${{ always() && steps.supplier.outputs.directory != '' }}
        shell: bash
        env:
          EXPOSURE_DIRECTORY: ${{ steps.supplier.outputs.directory }}
        run: |
          set -euo pipefail
          case "$EXPOSURE_DIRECTORY" in
            "$RUNNER_TEMP"/grant-exposure-download.*) ;;
            *) echo 'Refusing cleanup outside owned Exposure directory' >&2; exit 1 ;;
          esac
          test "$(dirname -- "$EXPOSURE_DIRECTORY")" = "$RUNNER_TEMP"
          rm -f -- "$EXPOSURE_DIRECTORY/exposure.zip"
          test ! -e "$EXPOSURE_DIRECTORY/exposure.zip"
          test ! -L "$EXPOSURE_DIRECTORY/exposure.zip"

  go-verification:
    needs: exposure-artifact
    if: >-
      ${{ !cancelled() && !inputs.publish_rauthy_launcher_gar &&
        (needs.exposure-artifact.result == 'success' || needs.exposure-artifact.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk
        run: |
          echo "[storage] before cleanup"
          df -h
          docker system df || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af --volumes || true
          echo "[storage] after cleanup"
          df -h
          docker system df || true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          files=$(gofmt -l internal cmd)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            gofmt -d internal cmd
            exit 1
          fi

      - name: Verify replica-members Go module
        working-directory: scripts/replica-members-src
        run: |
          go mod verify
          go test -race ./...
          go vet ./...

      - name: Verify runtime tool packaging
        run: sh scripts/verify-runtime-tools.sh

      - name: Compile Grant and API tests
        run: go test -run '^$' ./internal/grant ./internal/api

      - name: Build Go executables
        run: CGO_ENABLED=0 go build ./cmd/...

      - name: Prepare optional Exposure artifact directory
        if: ${{ inputs.exposure_artifact_asset_id != '' }}
        id: exposure-artifact
        shell: bash
        run: |
          set -euo pipefail
          exposure_dir="$(mktemp -d "$RUNNER_TEMP/grant-exposure-interop.XXXXXX")"
          echo "directory=$exposure_dir" >> "$GITHUB_OUTPUT"
          mkdir "$exposure_dir/received" "$exposure_dir/evidence" "$exposure_dir/evidence/process-logs"

      - name: Download verified Exposure artifact from this run
        if: ${{ inputs.exposure_artifact_asset_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: exposure-verified-supplier
          path: ${{ steps.exposure-artifact.outputs.directory }}/received

      - name: Reverify optional Exposure artifact and executable
        if: ${{ inputs.exposure_artifact_asset_id != '' }}
        shell: bash
        env:
          EXPOSURE_ASSET_ID: ${{ inputs.exposure_artifact_asset_id }}
          EXPOSURE_ARTIFACT_SHA256: ${{ inputs.exposure_artifact_sha256 }}
          EXPOSURE_BINARY_SHA256: ${{ inputs.exposure_binary_sha256 }}
          EXPOSURE_SOURCE_SHA: ${{ inputs.exposure_source_sha }}
          EXPOSURE_DIRECTORY: ${{ steps.exposure-artifact.outputs.directory }}
        run: |
          set -euo pipefail
          exposure_dir="$EXPOSURE_DIRECTORY"
          cp "$exposure_dir/received/evidence/supplier.txt" "$exposure_dir/evidence/supplier.txt"
          printf 'asset_id=%s\nartifact_sha256=%s\nbinary_sha256=%s\nsource_sha=%s\n' \
            "$EXPOSURE_ASSET_ID" "$EXPOSURE_ARTIFACT_SHA256" \
            "$EXPOSURE_BINARY_SHA256" "$EXPOSURE_SOURCE_SHA" \
            | cmp - "$exposure_dir/evidence/supplier.txt"
          printf '%s  %s\n' "$EXPOSURE_ARTIFACT_SHA256" "$exposure_dir/received/exposure.zip" \
            | sha256sum --check | tee "$exposure_dir/evidence/archive-check.log"
          unzip -p "$exposure_dir/received/exposure.zip" exposure \
            > "$exposure_dir/exposure" 2> "$exposure_dir/evidence/extract.log"
          printf '%s  %s\n' "$EXPOSURE_BINARY_SHA256" "$exposure_dir/exposure" \
            | sha256sum --check | tee "$exposure_dir/evidence/binary-check.log"
          chmod +x "$exposure_dir/exposure"

      - name: Verify optional Exposure process interop
        if: ${{ inputs.exposure_artifact_asset_id != '' }}
        shell: bash
        env:
          GRANT_EXPOSURE_BINARY: ${{ steps.exposure-artifact.outputs.directory }}/exposure
          GRANT_EXPOSURE_BINARY_SHA256: ${{ inputs.exposure_binary_sha256 }}
          GRANT_EXPOSURE_INTEROP: '1'
          TMPDIR: ${{ steps.exposure-artifact.outputs.directory }}/evidence/process-logs
          GRANT_EXPOSURE_EVIDENCE: ${{ steps.exposure-artifact.outputs.directory }}/evidence
        run: |
          set -euo pipefail
          go test -run '^TestPrincipalExposureProcess$' -count=1 -v -timeout 2m ./internal/api \
            2>&1 | tee "$GRANT_EXPOSURE_EVIDENCE/interop.log"
          grep -Eq '^--- PASS: TestPrincipalExposureProcess \(' "$GRANT_EXPOSURE_EVIDENCE/interop.log"

      - name: Preserve optional Exposure interop evidence
        if: ${{ always() && inputs.exposure_artifact_asset_id != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exposure-interop-evidence
          path: ${{ runner.temp }}/grant-exposure-interop.*/evidence/
          if-no-files-found: ignore

      - name: Remove optional Exposure downloaded executables
        if: ${{ always() && inputs.exposure_artifact_asset_id != '' && steps.exposure-artifact.outputs.directory != '' }}
        shell: bash
        env:
          EXPOSURE_DIRECTORY: ${{ steps.exposure-artifact.outputs.directory }}
        run: |
          set -euo pipefail
          case "$EXPOSURE_DIRECTORY" in
            "$RUNNER_TEMP"/grant-exposure-interop.*) ;;
            *) echo 'Refusing cleanup outside owned Exposure directory' >&2; exit 1 ;;
          esac
          test "$(dirname -- "$EXPOSURE_DIRECTORY")" = "$RUNNER_TEMP"
          rm -f -- "$EXPOSURE_DIRECTORY/received/exposure.zip" "$EXPOSURE_DIRECTORY/exposure"
          for artifact in "$EXPOSURE_DIRECTORY/received/exposure.zip" "$EXPOSURE_DIRECTORY/exposure"; do
            test ! -e "$artifact" && test ! -L "$artifact"
          done

      - name: Verify independent S3 GCS and Azure process recovery
        timeout-minutes: 30
        run: sh scripts/verify-independent-environment.sh dr
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Preserve independent environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-environment-evidence
          path: |
            ${{ runner.temp }}/grant-independent-environment.*
            ${{ runner.temp }}/grant-independent-evidence.*
          if-no-files-found: ignore

      - name: Vet Go packages
        run: go vet ./...

      - name: Extract verified v0.9.0 Local upgrade baseline
        id: upgrade-baseline
        shell: sh -eu {0}
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          scope="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          work="$RUNNER_TEMP/grant-upgrade-baseline-$scope"
          evidence="$RUNNER_TEMP/grant-upgrade-evidence-$scope"
          test ! -e "$work"
          mkdir -m 700 "$work"
          printf '%s\n' "$scope" > "$work/owner"
          mkdir -m 700 "$work/docker-config"
          mkdir -p "$evidence"
          export DOCKER_CONFIG="$work/docker-config"
          export DOCKER_HOST=unix:///var/run/docker.sock
          image=ghcr.io/mrchypark/grant@sha256:da3a5c9c0193870b5c892cb5407f657cc19df88b31593dd7bb8e94b48445e70f
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = f0ab0e7684f279dc84f82f22c7537d3679780eb9
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = v0.9.0
          printf 'image=%s\nsource=%s\nversion=v0.9.0\nplatform=linux/amd64\n' "$image" f0ab0e7684f279dc84f82f22c7537d3679780eb9 > "$evidence/baseline.txt"
          docker create --name "grant-upgrade-$scope" --label "io.grant.upgrade-baseline=$scope" --network none "$image" > "$work/container-id"
          cid=$(cat "$work/container-id")
          docker cp "$cid:/usr/local/bin/grant" "$work/grant"
          chmod 700 "$work/grant"
          go version -m "$work/grant" > "$evidence/binary-buildinfo.txt"
          grep -Eq 'CGO_ENABLED=0$' "$evidence/binary-buildinfo.txt"
          grep -Eq 'GOOS=linux$' "$evidence/binary-buildinfo.txt"
          grep -Eq 'GOARCH=amd64$' "$evidence/binary-buildinfo.txt"
          grep -Eq 'dep[[:space:]]+github.com/mrchypark/rhiza[[:space:]]+v0.21.2([[:space:]]|$)' "$evidence/binary-buildinfo.txt"
          sha256sum "$work/grant" > "$evidence/binary-sha256.txt"
          digest=$(cut -d ' ' -f 1 "$evidence/binary-sha256.txt")
          printf 'binary=%s\nsha256=%s\n' "$work/grant" "$digest" >> "$GITHUB_OUTPUT"

      - name: Test Go contracts and race safety
        env:
          GRANT_SINGLE_VOTER_RESTORE_CONTRACT: "1"
          GRANT_SINGLE_VOTER_RESTORE_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          GRANT_SINGLE_VOTER_RESTORE_EVIDENCE: ${{ runner.temp }}/grant-single-voter-restore-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DOCKER_HOST: unix:///var/run/docker.sock
          GRANT_UPGRADE_BASELINE_REQUIRED: "1"
          GRANT_UPGRADE_BASELINE_BINARY: ${{ steps.upgrade-baseline.outputs.binary }}
          GRANT_UPGRADE_BASELINE_SHA256: ${{ steps.upgrade-baseline.outputs.sha256 }}
        run: |
          set -eu
          work="$RUNNER_TEMP/grant-single-voter-restore-$GRANT_SINGLE_VOTER_RESTORE_SCOPE"
          evidence="$RUNNER_TEMP/grant-single-voter-restore-evidence-$GRANT_SINGLE_VOTER_RESTORE_SCOPE"
          test ! -e "$work"
          mkdir -m 700 "$work"
          mkdir -p "$evidence"
          result=0
          TMPDIR="$work" go test -race ./... || result=$?
          printf 'test_exit=%s\n' "$result" > "$evidence/test-result.txt"
          exit "$result"

      - name: Remove owned Local upgrade baseline
        if: always()
        shell: sh -eu {0}
        run: |
          scope="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          work="$RUNNER_TEMP/grant-upgrade-baseline-$scope"
          evidence="$RUNNER_TEMP/grant-upgrade-evidence-$scope"
          test -e "$work" || exit 0
          test "$(cat "$work/owner")" = "$scope"
          trap 'rm -f "$work/grant"; rm -rf "$work/docker-config"' EXIT
          mkdir -p "$evidence"
          export DOCKER_CONFIG="$work/docker-config"
          export DOCKER_HOST=unix:///var/run/docker.sock
          ids=$(docker ps -aq --no-trunc --filter "label=io.grant.upgrade-baseline=$scope")
          for cid in $ids; do
            test "$(docker inspect --format '{{index .Config.Labels "io.grant.upgrade-baseline"}}' "$cid")" = "$scope"
            test "$(docker inspect --format '{{.Name}}' "$cid")" = "/grant-upgrade-$scope"
            docker rm -v "$cid"
          done
          test -z "$(docker ps -aq --no-trunc --filter "label=io.grant.upgrade-baseline=$scope")"
          rm -rf "$work"
          test ! -e "$work"
          printf '%s\n' 'Owned non-running container, baseline binary and isolated registry credentials removed.' > "$evidence/cleanup.txt"

      - name: Preserve Local upgrade provenance and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-upgrade-baseline-evidence
          path: ${{ runner.temp }}/grant-upgrade-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore

      - name: Remove owned single-voter restore emulators
        if: always()
        env:
          GRANT_SINGLE_VOTER_RESTORE_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -eu
          unset DOCKER_CONTEXT
          scope="$GRANT_SINGLE_VOTER_RESTORE_SCOPE"
          work="$RUNNER_TEMP/grant-single-voter-restore-$scope"
          evidence="$RUNNER_TEMP/grant-single-voter-restore-evidence-$scope"
          mkdir -p "$evidence"
          result=0
          ids=$(docker ps -aq --no-trunc --filter "label=io.grant.single-voter-restore=$scope") || {
            printf '%s\n' 'UNVERIFIED: cannot list scoped containers' >> "$evidence/cleanup.txt"
            result=1
            ids=''
          }
          printf '%s\n' "$ids" > "$evidence/container-ids.txt"
          for cid in $ids; do
            actual=$(docker inspect --format '{{index .Config.Labels "io.grant.single-voter-restore"}}' "$cid") || { result=1; continue; }
            owner=$(docker inspect --format '{{index .Config.Labels "grant.independent.owner"}}' "$cid") || { result=1; continue; }
            name=$(docker inspect --format '{{.Name}}' "$cid") || { result=1; continue; }
            case "$owner" in grant-restore-*) ;; *) result=1; continue ;; esac
            if [ "$actual" != "$scope" ] || [ "$name" != "/$owner" ]; then
              printf 'UNVERIFIED: ownership mismatch for %s\n' "$cid" >> "$evidence/cleanup.txt"
              result=1
              continue
            fi
            docker inspect --format '{{.Id}} {{.State.Status}} {{.Config.Image}}' "$cid" >> "$evidence/container-state.txt" || result=1
            docker rm -f -v "$cid" >> "$evidence/cleanup.txt" 2>&1 || result=1
          done
          remaining=$(docker ps -aq --no-trunc --filter "label=io.grant.single-voter-restore=$scope") || {
            printf '%s\n' 'UNVERIFIED: container absence check failed' >> "$evidence/cleanup.txt"
            result=1
            remaining='unknown'
          }
          if [ -n "$remaining" ]; then
            printf 'UNVERIFIED: remaining scoped containers %s\n' "$remaining" >> "$evidence/cleanup.txt"
            result=1
          fi
          rm -rf -- "$work"
          if [ -e "$work" ]; then
            printf '%s\n' 'UNVERIFIED: owned temporary data remains' >> "$evidence/cleanup.txt"
            result=1
          fi
          if [ "$result" -eq 0 ]; then
            printf '%s\n' 'Scoped container absence and owned temporary-data removal verified' >> "$evidence/cleanup.txt"
          fi
          cat "$evidence/cleanup.txt"
          exit "$result"

      - name: Preserve single-voter restore cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: single-voter-restore-cleanup-evidence
          path: ${{ runner.temp }}/grant-single-voter-restore-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          if-no-files-found: error

      - name: Verify executable stdout and SQLite export contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 jq
          sh scripts/verify-go-cli-contract.sh

      - name: Verify native quorum and fresh-cluster restore
        run: sh scripts/verify-go-three-voter.sh

      - name: Install pinned standalone render tools
        run: |
          curl -fSL --retry 3 --connect-timeout 20 --max-time 180 -o kubectl https://dl.k8s.io/release/v1.35.3/bin/linux/amd64/kubectl
          curl -fSL --retry 3 --connect-timeout 20 --max-time 180 -o kubectl.sha256 https://dl.k8s.io/release/v1.35.3/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          curl -fSL --retry 3 --connect-timeout 20 --max-time 180 -o yq https://github.com/mikefarah/yq/releases/download/v4.52.5/yq_linux_amd64
          chmod +x kubectl yq
          sudo mv kubectl yq /usr/local/bin/
          rm kubectl.sha256

      - name: Verify standalone manifests and configuration
        run: |
          sh scripts/verify-standalone-container-ownership.sh
          sh scripts/verify-standalone-deployment.sh
          sh scripts/verify-standalone-nopvc-deployment.sh

      - name: Verify native AMD64 container under production security limits
        run: |
          docker build --platform linux/amd64 --label org.opencontainers.image.revision="${GITHUB_SHA}" -t grant:container-verify .
          IMAGE_NAME=grant:container-verify sh scripts/verify-go-container.sh
          IMAGE_NAME=grant:container-verify LOG_DIR="$RUNNER_TEMP/standalone-container-logs" sh scripts/verify-standalone-container.sh
          IMAGE_NAME=grant:container-verify OBJECT_STORE_DURABILITY=async LOG_DIR="$RUNNER_TEMP/standalone-container-logs/async" sh scripts/verify-standalone-container.sh

      - name: Preserve standalone container logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-container-logs
          path: ${{ runner.temp }}/standalone-container-logs
          if-no-files-found: ignore

  local-bootstrap:
    if: ${{ !cancelled() && !inputs.publish_rauthy_launcher_gar && needs.go-verification.result == 'success' }}
    runs-on: ubuntu-24.04
    needs: go-verification
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reclaim runner disk
        run: |
          echo "[storage] before cleanup"
          df -h
          docker system df || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af --volumes || true
          echo "[storage] after cleanup"
          df -h
          docker system df || true

      - name: Install kubectl
        run: |
          curl_retry_args=(
            --fail
            --show-error
            --silent
            --location
            --retry 5
            --retry-delay 3
            --retry-all-errors
            --connect-timeout 20
            --max-time 300
          )
          KUBECTL_VERSION="$(curl "${curl_retry_args[@]}" https://dl.k8s.io/release/stable.txt)"
          curl "${curl_retry_args[@]}" -o kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install vCluster CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl_retry_args=(
            --fail
            --show-error
            --silent
            --location
            --proto '=https'
            --proto-redir '=https'
            --retry 2
            --retry-delay 3
            --retry-max-time 60
            --connect-timeout 15
            --max-time 60
          )
          VCLUSTER_VERSION="0.33.1"
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64)
              ARCH="amd64"
              asset_id=381693948
              asset_sha256=bed0e91223996ce469b60187d9ec9191987d2b7ea4b785bba9fa6ace7616dfe8
              ;;
            aarch64|arm64)
              ARCH="arm64"
              asset_id=381693946
              asset_sha256=426c8b740e7388bfd92c1f09ed32a655570ba1e2220962d231607cc7bc16fbd5
              ;;
            *)
              echo "unsupported architecture: ${ARCH}" >&2
              exit 1
              ;;
          esac
          vcluster_bin="$(mktemp)"
          trap 'unlink "$vcluster_bin"' EXIT
          if ! curl --disable "${curl_retry_args[@]}" -o "$vcluster_bin" \
            "https://github.com/loft-sh/vcluster/releases/download/v${VCLUSTER_VERSION}/vcluster-linux-${ARCH}"; then
            echo "vCluster direct download failed; trying official release asset API (asset $asset_id)" >&2
            curl --disable "${curl_retry_args[@]}" -o "$vcluster_bin" \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
              "https://api.github.com/repos/loft-sh/vcluster/releases/assets/$asset_id"
          fi
          printf '%s  %s\n' "$asset_sha256" "$vcluster_bin" | sha256sum --check
          sudo install -m 0755 "$vcluster_bin" /usr/local/bin/vcluster

      - name: Preload kernel modules
        run: |
          sudo modprobe br_netfilter
          sudo modprobe bridge || true
          sudo modprobe overlay || true

      - name: Install jq and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        run: |
          docker version
          kubectl version --client
          vcluster version
          jq --version
          shellcheck --version
          actionlint -version

      - name: Verify local scripts
        run: |
          bash_scripts=(
            scripts/vind-exec.sh
            scripts/vind-cluster.sh
            scripts/ci-local.sh
            scripts/vind-bootstrap.sh
            scripts/vind-image-helpers.sh
            scripts/verify-vind-bootstrap.sh
            scripts/gke-skaffold-run.sh
          )
          posix_scripts=(
            scripts/k8s-secret-helpers.sh
            scripts/check-s3-object-history.sh
            scripts/verify-lifecycle-values.sh
            scripts/verify-runtime-tools.sh
            scripts/verify-go-cli-contract.sh
            scripts/verify-go-three-voter.sh
            scripts/verify-independent-environment.sh
            scripts/verify-independent-object-dr.sh
            scripts/oci-redirect-fixture
            scripts/replica-members
            scripts/verify-oci-attestations.sh
            scripts/verify-oci-attestations-tests.sh
            scripts/verify-ephemeral-k8s.sh
            scripts/verify-s3-object-history.sh
            scripts/verify-docs.sh
            scripts/verify-rhiza-deployment.sh
            scripts/verify-go-container.sh
            scripts/verify-standalone-container.sh
            scripts/verify-standalone-container-ownership.sh
            scripts/verify-standalone-deployment.sh
            scripts/ghcr-tag-preflight.sh
            scripts/verify-ghcr-tag-preflight.sh
            scripts/materialize-s3-restore.sh
            scripts/cached-go-module.sh
            scripts/create-recovery-pair.sh
            scripts/restore-full-cluster.sh
            deploy/k8s/lifecycle-gate.sh
          )
          bash -n "${bash_scripts[@]}"
          for script in "${posix_scripts[@]}"; do sh -n "${script}"; done
          shellcheck --exclude=SC2015 "${bash_scripts[@]}" "${posix_scripts[@]}"
          actionlint -shellcheck= .github/workflows/*.yml

      - name: Verify docs and recovery manifests
        run: |
          scripts/verify-docs.sh
          sh scripts/verify-rhiza-deployment.sh
          sh scripts/verify-ghcr-tag-preflight.sh
          scripts/verify-ephemeral-k8s.sh static

      - name: Run local bootstrap regression
        env:
          CLUSTER_NAME: grant-vind-ci
          CI_CLUSTER_BACKEND: vind
          CI_DOCKER_BUILDER_PRUNE: "1"
          NAMESPACE: grant
          GRANT_MASTER_KEY: local-dev-master-key
          GRANT_APP_AUTH_KEY: local-dev-app-auth-key
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESET_CLUSTER: "1"
          KEEP_CLUSTER: "0"
        run: bash scripts/ci-local.sh

  launcher-source-guard:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_rauthy_launcher_gar &&
        github.repository == 'mrchypark/grant' &&
        github.ref == 'refs/heads/feature/grant-simple-deploy-v1'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify exact launcher source
        env:
          SOURCE_SHA: ${{
            inputs.launcher_source_sha }}
          CONFIRMATION: ${{
            inputs.launcher_confirmation }}
        run: |
          set -euo pipefail
          test "${CONFIRMATION}" = publish-grant-rauthy-launcher-gar
          printf '%s\n' "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          test "${SOURCE_SHA}" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain=v1)"
          grep -Fx 'ARG RAUTHY_BASE_IMAGE=ghcr.io/sebadob/rauthy:0.37.1@sha256:72b4734a7c52bd67cd544e7b72a4ab64932a7060844ef475fc2bb3d3da3074d9' \
            deploy/rauthy-launcher/Dockerfile

  launcher-tag-preflight:
    needs: launcher-source-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{
        steps.tag.outputs.tag }}
    steps:
      - name: Compute the reusable workflow tag
        id: tag
        env:
          GCP_REGISTRY_HOST: ${{
            secrets.GCP_REGISTRY_HOST }}
          GCP_PROJECT_ID: ${{
            secrets.GCP_PROJECT_ID }}
          GCP_REPOSITORY: ${{
            secrets.GCP_REPOSITORY }}
        run: |
          set -euo pipefail
          test "${GCP_REGISTRY_HOST}" = "asia-northeast3-docker.pkg.dev"
          test "${GCP_PROJECT_ID}" = "patch2-the-new-era"
          test "${GCP_REPOSITORY}" = "conalog"
          tag="$(TZ=Asia/Seoul date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{
            secrets.GCP_REGISTRY_HOST }}
          username: _json_key
          password: ${{
            secrets.GCP_SA_KEY }}

      - name: Refuse an existing tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GCP_REGISTRY_HOST: ${{ secrets.GCP_REGISTRY_HOST }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REPOSITORY: ${{ secrets.GCP_REPOSITORY }}
        run: |
          set -euo pipefail
          test "${GCP_REGISTRY_HOST}" = "asia-northeast3-docker.pkg.dev"
          test "${GCP_PROJECT_ID}" = "patch2-the-new-era"
          test "${GCP_REPOSITORY}" = "conalog"
          tagged_image="${GCP_REGISTRY_HOST}/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/grant-rauthy-launcher:${TAG}"
          inspect_error=""
          if inspect_error="$(docker buildx imagetools inspect "${tagged_image}" 2>&1)"; then
            echo "::error::refusing to overwrite existing image tag ${tagged_image}"
            exit 1
          fi
          case "${inspect_error}" in
            *"not found"*|*"Not Found"*|*"manifest unknown"*) ;;
            *)
              echo "::error::could not prove image tag absence"
              exit 1
              ;;
          esac

  launcher-tag-recheck:
    needs: launcher-tag-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse a KST date rollover before publication
        env:
          EXPECTED_TAG: ${{ needs.launcher-tag-preflight.outputs.tag }}
          GCP_REGISTRY_HOST: ${{
            secrets.GCP_REGISTRY_HOST }}
          GCP_PROJECT_ID: ${{
            secrets.GCP_PROJECT_ID }}
          GCP_REPOSITORY: ${{
            secrets.GCP_REPOSITORY }}
        run: |
          set -euo pipefail
          test "${GCP_REGISTRY_HOST}" = "asia-northeast3-docker.pkg.dev"
          test "${GCP_PROJECT_ID}" = "patch2-the-new-era"
          test "${GCP_REPOSITORY}" = "conalog"
          tag="$(TZ=Asia/Seoul date +%Y%m%d)-${GITHUB_SHA::7}"
          test "${tag}" = "${EXPECTED_TAG}"

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{
            secrets.GCP_REGISTRY_HOST }}
          username: _json_key
          password: ${{
            secrets.GCP_SA_KEY }}

      - name: Recheck that the tag is absent
        env:
          TAG: ${{ needs.launcher-tag-preflight.outputs.tag }}
          GCP_REGISTRY_HOST: ${{ secrets.GCP_REGISTRY_HOST }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REPOSITORY: ${{ secrets.GCP_REPOSITORY }}
        run: |
          set -euo pipefail
          test "${GCP_REGISTRY_HOST}" = "asia-northeast3-docker.pkg.dev"
          test "${GCP_PROJECT_ID}" = "patch2-the-new-era"
          test "${GCP_REPOSITORY}" = "conalog"
          tagged_image="${GCP_REGISTRY_HOST}/${GCP_PROJECT_ID}/${GCP_REPOSITORY}/grant-rauthy-launcher:${TAG}"
          inspect_error=""
          if inspect_error="$(docker buildx imagetools inspect "${tagged_image}" 2>&1)"; then
            echo "::error::refusing to overwrite existing image tag ${tagged_image}"
            exit 1
          fi
          case "${inspect_error}" in
            *"not found"*|*"Not Found"*|*"manifest unknown"*) ;;
            *)
              echo "::error::could not prove image tag absence"
              exit 1
              ;;
          esac

  publish-rauthy-launcher-gar:
    needs: launcher-tag-recheck
    uses: ./.github/workflows/buildandpush.yaml
    secrets: inherit
    with:
      application-name: grant-rauthy-launcher
      context: ./deploy/rauthy-launcher
      dockerfile: ./deploy/rauthy-launcher/Dockerfile
      arch: linux/amd64
      go-build-cache: true
