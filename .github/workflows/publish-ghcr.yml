name: Publish application image to GHCR

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish grant
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image and private package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          revision_digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Digest}}')"
          latest_digest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Digest}}')"
          test "$revision_digest" = "$BUILD_DIGEST"
          test "$latest_digest" = "$BUILD_DIGEST"
          visibility="$(gh api "user/packages/container/$PACKAGE_NAME" --jq .visibility)"
          test "$visibility" = private
          {
            echo '## GHCR publication verified'
            echo
            echo "- Image: \`$IMAGE\`"
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Tags: \`sha-$GITHUB_SHA\`, \`latest\`"
            echo "- Digest: \`$BUILD_DIGEST\`"
            echo "- Package visibility: \`$visibility\`"
            echo "- OCI source: \`https://github.com/$GITHUB_REPOSITORY\`"
            echo "- OCI revision: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
