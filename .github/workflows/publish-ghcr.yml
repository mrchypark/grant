name: Publish application image to GHCR

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release version and record source revision
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          tag=$RELEASE_TAG
          [ ${#tag} -le 128 ] || { echo "Release tag exceeds Docker's 128-character tag limit" >&2; exit 1; }
          printf '%s\n' "$tag" | awk '
            {
              t = $0
              sub(/^v/, "", t)
              if (t !~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/) exit 1
              if (index(t, "+")) exit 1
              if (index(t, "-")) {
                sub(/^[^-]*-/, "", t)
                n = split(t, ids, ".")
                for (i = 1; i <= n; i++) {
                  if (ids[i] ~ /^[0-9]+$/ && length(ids[i]) > 1 && ids[i] ~ /^0/) exit 1
                }
              }
            }
          ' || { echo "Invalid SemVer release tag (optional v prefix; build metadata is unsupported)" >&2; exit 1; }
          revision="$(git rev-parse HEAD)"
          {
            echo "IMAGE_TAG=$tag"
            echo "SOURCE_REVISION=$revision"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish grant
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image and private package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          image_digest="$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}')"
          test "$image_digest" = "$BUILD_DIGEST"
          visibility="$(gh api "users/$PACKAGE_OWNER/packages/container/$PACKAGE_NAME" --jq .visibility)"
          test "$visibility" = private
          {
            echo '## GHCR publication verified'
            echo
            echo "- Image: \`$IMAGE\`"
            echo "- Version: $IMAGE_TAG"
            echo "- Revision: $SOURCE_REVISION"
            echo "- Tag: $IMAGE_TAG"
            echo "- Digest: \`$BUILD_DIGEST\`"
            echo "- Package visibility: \`$visibility\`"
            echo "- OCI source: \`https://github.com/$GITHUB_REPOSITORY\`"
            echo "- OCI revision: $SOURCE_REVISION"
          } >> "$GITHUB_STEP_SUMMARY"
