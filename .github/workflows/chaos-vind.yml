name: chaos-vind

on:
  workflow_dispatch:

concurrency:
  group: chaos-vind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos-vind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create vind cluster
        uses: loft-sh/setup-vind@v1
        with:
          version: latest
          name: certd-vind-ci

      - name: Run vind chaos regression
        env:
          CLUSTER_NAME: certd-vind-ci
          CI_CLUSTER_BACKEND: vind
          NAMESPACE: certd
          CERTD_MASTER_KEY: local-dev-master-key
          RESET_CLUSTER: "1"
          KEEP_CLUSTER: "0"
          CERTD_CHAOS_WITH_LOAD: "1"
        run: bash scripts/ci-chaos-local.sh

