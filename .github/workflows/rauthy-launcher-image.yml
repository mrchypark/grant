name: rauthy-launcher-image

on:
  pull_request:
    paths:
      - ".github/workflows/rauthy-launcher-image.yml"
      - "deploy/rauthy-launcher/**"
      - "deploy/k8s/rauthy-statefulset.yaml"
      - "deploy/overlays/**"
      - "scripts/**"
      - "docs/backup-restore.md"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main HEAD to publish
        required: true
        type: string
      confirmation:
        description: Type publish-rauthy-launcher-production
        required: true
        type: string

concurrency:
  group: rauthy-launcher-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/conalog/grant-rauthy-launcher

jobs:
  contract:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - name: Validate main publication source
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          printf '%s\n' "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          test "${SOURCE_SHA}" = "${DISPATCH_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "${CONFIRMATION}" = publish-rauthy-launcher-production

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: deploy/rauthy-launcher/go.mod
          cache-dependency-path: deploy/rauthy-launcher/go.mod

      - name: Test launcher
        working-directory: deploy/rauthy-launcher
        run: |
          gofmt -w *.go
          git diff --exit-code -- .
          go test -race ./...
          go vet ./...

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and execute real image contract
        run: |
          docker buildx build --load --platform linux/amd64 \
            --tag grant-rauthy-launcher:contract deploy/rauthy-launcher
          docker run --rm --platform linux/amd64 \
            grant-rauthy-launcher:contract --contract-check

      - name: Verify multi-architecture build without publishing
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --output type=oci,dest="${RUNNER_TEMP}/rauthy-launcher.oci" \
            deploy/rauthy-launcher
          test -s "${RUNNER_TEMP}/rauthy-launcher.oci"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-rauthy-launcher-production'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: rauthy-launcher-production-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.source_sha }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing commit tag
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          sh scripts/ghcr-tag-preflight.sh

      - name: Build and publish source-addressed image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: deploy/rauthy-launcher
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:rauthy-0.36.0-${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
          provenance: mode=max
          sbom: true

      - name: Attest production image provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "${IMAGE}:rauthy-0.36.0-${{ inputs.source_sha }}@${DIGEST}"
          echo "Published digest: ${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
