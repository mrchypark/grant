name: rauthy-launcher-image

on:
  pull_request:
    paths:
      - ".github/workflows/rauthy-launcher-image.yml"
      - "deploy/rauthy-launcher/**"
      - "deploy/k8s/rauthy-statefulset.yaml"
      - "deploy/overlays/**"
      - "scripts/**"
      - "docs/backup-restore.md"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main HEAD to publish
        required: true
        type: string
      confirmation:
        description: Type publish-rauthy-launcher-production
        required: true
        type: string

concurrency:
  group: rauthy-launcher-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mrchypark/grant-rauthy-launcher

jobs:
  contract:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - name: Validate main publication source
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          printf '%s\n' "${SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          test "${SOURCE_SHA}" = "${DISPATCH_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "${CONFIRMATION}" = publish-rauthy-launcher-production

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: deploy/rauthy-launcher/go.mod
          cache-dependency-path: deploy/rauthy-launcher/go.mod

      - name: Test launcher
        working-directory: deploy/rauthy-launcher
        run: |
          gofmt -w ./*.go
          git diff --exit-code -- .
          go test -race ./...
          go vet ./...

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Build and execute real image contract
        run: |
          docker buildx build --load --platform linux/amd64 \
            --tag grant-rauthy-launcher:contract deploy/rauthy-launcher
          docker run --rm --platform linux/amd64 \
            grant-rauthy-launcher:contract --contract-check

      - name: Verify multi-architecture build without publishing
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --output type=oci,dest="${RUNNER_TEMP}/rauthy-launcher.oci" \
            deploy/rauthy-launcher
          test -s "${RUNNER_TEMP}/rauthy-launcher.oci"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-rauthy-launcher-production'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: rauthy-launcher-production-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine whether the commit tag already exists
        id: preflight
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          sh scripts/ghcr-tag-preflight.sh

      - name: Resolve an existing commit tag without overwriting it
        id: existing
        if: steps.preflight.outputs.tag_exists == 'true'
        env:
          IMAGE_REF: ${{ env.IMAGE }}:rauthy-0.37.1-${{ inputs.source_sha }}
        run: |
          test "${GITHUB_RUN_ATTEMPT}" -gt 1
          digest=$(docker buildx imagetools inspect "${IMAGE_REF}" |
            awk '/^Digest:/ { if (++count > 1) exit 2; digest=$2 } END { if (count != 1) exit 2; print digest }')
          printf '%s\n' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish source-addressed image
        id: build
        if: steps.preflight.outputs.tag_exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/rauthy-launcher
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:rauthy-0.37.1-${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
          provenance: mode=max,version=v1
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68

      - name: Select immutable digest
        id: digest
        env:
          TAG_EXISTS: ${{ steps.preflight.outputs.tag_exists }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "${TAG_EXISTS}" in
            true) digest=${EXISTING_DIGEST} ;;
            false) digest=${BUILD_DIGEST} ;;
            *) echo "preflight did not select a publication path" >&2; exit 1 ;;
          esac
          printf '%s\n' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Verify portable OCI provenance and SBOM attestations
        env:
          IMAGE_REPOSITORY: ${{ env.IMAGE }}
          IMAGE_REF: ${{ env.IMAGE }}:rauthy-0.37.1-${{ inputs.source_sha }}
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_BUILDER_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          EXPECTED_BUILDER_MODE: ${{ steps.preflight.outputs.tag_exists == 'true' && 'prior-attempt' || 'current' }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/verify-oci-attestations.sh

      - name: Record immutable digest
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          printf '%s\n' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "${IMAGE}:rauthy-0.37.1-${{ inputs.source_sha }}@${DIGEST}"
          echo "Published digest: ${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
