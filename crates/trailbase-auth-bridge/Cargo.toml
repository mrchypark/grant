[workspace]

[package]
name = "trailbase-auth-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
trailbase = { git = "https://github.com/trailbaseio/trailbase.git", package = "trailbase", default-features = false }
trailbase-sqlite = { git = "https://github.com/trailbaseio/trailbase.git", package = "trailbase-sqlite" }
uuid = { version = "1", features = ["v4", "serde"] }
